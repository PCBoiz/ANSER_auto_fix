# Tên project cố định: bắt buộc, vì Compose mặc định lấy tên project từ tên thư mục chứa
# file này ("frontend") — và ANSER-web-v2/frontend cũng tên "frontend". Không đặt tên riêng,
# "docker compose up" ở dự án nào chạy SAU sẽ dò thấy container "frontend" của dự án kia,
# thấy container_name lệch với compose file của nó, rồi RECREATE (tức là xoá & tạo lại) —
# đã xảy ra thật một lần trong lúc phát triển, phải khôi phục thủ công container n8n của
# ANSER-web-v2. Xem ARCHITECTURE.md §8.4.
name: anser_auto

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: anser-auto-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5681}:5678"
    environment:
      # N8N_SECURE_COOKIE=false cần cho HTTP (không phải HTTPS).
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      # Không có dòng này, n8n báo URL webhook theo cổng nội bộ (5678) thay vì cổng đã
      # map ra host, khiến test thủ công bị sai URL.
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5681}/
    # Linux không tự có host.docker.internal như Docker Desktop — thiếu dòng này thì n8n trên
    # máy chủ Linux không gọi được app chạy ngoài Docker (npm start).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - anser_auto_n8n_data:/home/node/.n8n

  mailhog:
    image: mailhog/mailhog:latest
    container_name: anser-auto-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1027}:1025" # SMTP — node Send Email của n8n kết nối vào đây
      - "${MAILHOG_WEB_PORT:-8027}:8025" # Web UI — xem "email đã gửi" tại localhost:8027

  # App chạy trong Docker — CHỈ khi bật profile: `docker compose --profile app up -d --build`.
  # Không bật profile thì `docker compose up -d` vẫn như cũ (chỉ n8n + MailHog, app chạy ngoài).
  app:
    profiles: ["app"]
    build: .
    container_name: anser-auto-app
    # Chết thì Docker dựng lại — nửa "tự sửa" của vòng lặp ở mức tiến trình. Workflow canh gác
    # trong n8n vẫn báo nếu app chết liên tục (crash loop) vì /api/health không trả lời.
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    # DATABASE_URL, JWT_SECRET, N8N_INTERNAL_TOKEN, N8N_API_KEY, CRON_SECRET... — tạo file này
    # từ .env.local.example; .gitignore đã chặn .env*.
    env_file: .env.app
    environment:
      - INTERNAL_SCHEDULER=true
      # Workflow đồng bộ lên n8n sẽ gọi app bằng tên dịch vụ trong mạng compose.
      - APP_URL_FOR_N8N=http://app:3000
      - N8N_API_URL=http://n8n:5678
      # Sao lưu mỗi ngày 2h sáng vào volume riêng, giữ 14 bản. Volume vẫn nằm trên CÙNG máy —
      # vẫn phải chép ra ngoài định kỳ (xem docs/VIEC_CAN_LAM.md).
      - BACKUP_DIR=/app/backups
      # App gọi n8n (email báo nhanh) qua tên dịch vụ trong mạng compose.
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
    volumes:
      - anser_auto_backups:/app/backups
      # Bản sao THỨ HAI ra ngoài máy: đặt BACKUP_COPY_HOST_DIR (trong file .env cạnh file này)
      # là đường dẫn thư mục Google Drive/OneDrive trên máy chủ, và BACKUP_COPY_DIR=/app/backups-copy
      # trong .env.app. Không đặt thì gắn tạm vào volume (vẫn cùng máy — trang Kiểm tra vận hành nhắc).
      - ${BACKUP_COPY_HOST_DIR:-anser_auto_backups_copy}:/app/backups-copy

volumes:
  anser_auto_n8n_data:
  anser_auto_backups:
  anser_auto_backups_copy:
# Cổng 5681/1027/8027 được chọn để KHÔNG đụng ANSER Flask (5680/1025/8025) và
# ANSER Web v2 (5679/1026/8026) nếu chạy song song trên cùng một máy.
